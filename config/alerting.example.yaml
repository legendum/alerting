# Alerting app config - copy to alerting.yaml and fill in values.
# config/alerting.yaml is gitignored so secrets are not committed.
#
# Prefer storing values in .env (copy .env.example to .env). Bun loads .env
# automatically; any ALERT_* variable overrides the YAML (e.g. ALERT_SMTP_PASSWORD,
# ALERT_FIREBASE_PROJECT_ID, ALERT_FIREBASE_VAPID_PUBLIC_KEY).

# App
domain: "https://alerting.app"
db_path: "data/alerting.db"
app_name: "Alerting.app"   # Shown in UI and page title
mail_hour: 8        # Hour (0-23) to send daily digest emails in each user's timezone. Default: 8 (8am).

# SMTP - for login links and confirm-email. If omitted, emails are logged only.
# Password can be set in YAML or via ALERT_SMTP_PASSWORD env var (env takes precedence).
# smtp:
#   host: "smtp.example.com"
#   port: 587
#   secure: false
#   user: "noreply@alerting.app"
#   password: ""   # or set ALERT_SMTP_PASSWORD in the environment
#   from: "Alerting.app <noreply@alerting.app>"

# Firebase / FCM (see docs/FCM.md)
firebase:
  project_id: ""          # from Firebase Console
  messaging_sender_id: "" # from Firebase web app config
  # Optional: full config for frontend (apiKey, authDomain, storageBucket, appId)
  # api_key: ""
  # auth_domain: ""
  # storage_bucket: ""
  # app_id: ""

  # Web Push (VAPID) - get from Firebase -> Project settings -> Cloud Messaging -> Web Push certificates
  vapid_public_key: ""   # for frontend / service worker
  vapid_private_key: ""  # for backend only; keep secret

  # Service account - path to JSON key file (from Firebase -> Project settings -> Service accounts -> Generate new private key)
  # Backend uses this to send messages via FCM HTTP v1
  service_account_path: "" # e.g. "./secrets/firebase-service-account.json"
  # Or set GOOGLE_APPLICATION_CREDENTIALS env var instead
