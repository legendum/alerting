# Which pues/base/ subdirectories this consumer vendors.
# Add entries here to adopt more of pues over time, then run `bun run pues`.
pues:
  - core
  - theme
  - style
  - db
  - auth
  - billing
  - objects
  - sse
  - pwa

core:
  name: alerting

db:
  path: data/alerting.db

pwa:
  name: Alerting
  short_name: Alerting
  icon192: /alerting-192.png
  icon512: /alerting-512.png

objects:
  resources:
    webhooks:
      table: webhooks
      columns:
        updated_at:
        meta:
      filter:
        contains: [name, slug]
      slug:
        from: label
        # Single-segment routes alerting mounts at root, plus the public
        # webhook trigger path (`/w/:ulid`). Pues' built-in list covers
        # api, pues, dist.
        reserved: [w, webhooks, alerts, push, settings, inbox]

billing:
  topup_url: https://legendum.co.uk/account
  charges:
    alert_trigger:
      amount: 1
      description: "alerting.app alert"

style:
  vars:
    pues-topbar-height: "65px"
