<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Quota – __APP_NAME__</title>
    <link rel="stylesheet" href="/main.css" />
    <script>var COUPON_PRICES = __COUPON_PRICES__;</script>
    <style>
      body { margin: 0; min-height: 100vh; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 24px; padding-top: 24px; box-sizing: border-box; }
      .quota-page { max-width: 360px; width: 100%; }
      h1 { font-size: 24px; margin: 0 0 8px; }
      h2 { font-size: 16px; margin: 24px 0 12px; color: #94a3b8; font-weight: 600; }
      p { color: #94a3b8; margin: 0 0 16px; text-align: left; }
      a { color: #3b82f6; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .form-row { display: flex; gap: 8px; margin-bottom: 8px; }
      .form-row input { flex: 1; padding: 10px 12px; border: 1px solid #334155; border-radius: 8px; background: #1e293b; color: #e2e8f0; font-size: 14px; }
      .form-row button { padding: 10px 16px; border: none; border-radius: 8px; background: #334155; color: #e2e8f0; font-size: 14px; cursor: pointer; }
      .form-row button:hover { background: #475569; }
      .form-row button:disabled { opacity: 0.6; cursor: not-allowed; }
      .msg { font-size: 14px; margin-top: 8px; }
      .msg.success { color: #22c55e; }
      .msg.error { color: #f87171; }
      .buy-list { list-style: none; margin: 0; padding: 0; }
      .buy-list li { padding: 12px 0; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
      .buy-list li:last-child { border-bottom: none; }
      .buy-list .coming { font-size: 13px; color: #64748b; }
    </style>
  </head>
  <body>
    <div class="quota-page">
      <div id="back-block" style="margin-bottom: 32px;">
        <p style="margin: 0;"><a href="/">← Back to __APP_NAME__</a></p>
      </div>
      <h1>Quota</h1>
      <p>You get <strong>100 quota per week</strong> for free (resets 7 days after your last reset).</p>

      <div id="redeem-section" style="display: none;">
        <h2>Redeem a coupon</h2>
        <form id="redeem-form">
          <div class="form-row">
            <input type="text" id="coupon-id" placeholder="Coupon code" required autocomplete="off" />
            <button type="submit" id="redeem-btn">Redeem</button>
          </div>
          <div id="redeem-msg" class="msg" aria-live="polite"></div>
        </form>
      </div>

      <h2>Buy a coupon</h2>
      <ul class="buy-list" id="buy-list"></ul>
    </div>
    <script>
      (function() {
        fetch('/settings/me', { credentials: 'include' }).then(function(res) {
          if (res.ok) document.getElementById('redeem-section').style.display = '';
        }).catch(function() {});

        var referrer = document.referrer;
        if (!referrer) {
          document.getElementById('back-block').style.display = 'none';
        } else {
          try {
            if (new URL(referrer).origin !== window.location.origin) {
              document.getElementById('back-block').style.display = 'none';
            }
          } catch (e) {
            document.getElementById('back-block').style.display = 'none';
          }
        }

        var form = document.getElementById('redeem-form');
        var input = document.getElementById('coupon-id');
        var btn = document.getElementById('redeem-btn');
        var msg = document.getElementById('redeem-msg');

        form.addEventListener('submit', function(e) {
          e.preventDefault();
          msg.textContent = '';
          msg.className = 'msg';
          btn.disabled = true;
          fetch('/settings/redeem-coupon', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ coupon_id: input.value.trim() })
          }).then(function(res) {
            if (res.status === 401) {
              window.location.href = '/';
              return;
            }
            return res.json().then(function(data) {
              if (res.ok) {
                msg.textContent = 'Redeemed! ' + (data.quota_basic + data.quota_extra) + ' quota now available.';
                msg.className = 'msg success';
                input.value = '';
              } else {
                msg.textContent = data.message || 'Redeem failed.';
                msg.className = 'msg error';
              }
            });
          }).catch(function() {
            msg.textContent = 'Something went wrong.';
            msg.className = 'msg error';
          }).finally(function() {
            btn.disabled = false;
          });
        });

        var list = document.getElementById('buy-list');
        (typeof COUPON_PRICES !== 'undefined' ? COUPON_PRICES : []).forEach(function(o) {
          var li = document.createElement('li');
          li.innerHTML = '<span>' + (o.quota_extra || 0) + ' quota — $' + ((o.price_cents || 0) / 100).toFixed(2) + '</span><span class="coming">Coming soon</span>';
          list.appendChild(li);
        });
      })();
    </script>
  </body>
</html>
