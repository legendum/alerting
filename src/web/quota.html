<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Quota – __APP_NAME__</title>
    <link rel="stylesheet" href="/main.css" />
    <script>var COUPON_PRICES = __COUPON_PRICES__;</script>
  </head>
  <body class="quota-body">
    <div class="quota-page">
      <div id="back-block" class="quota-back">
        <p><a href="/">← Back to __APP_NAME__</a></p>
      </div>
      <div class="quota-intro">
        <h1>__APP_NAME__</h1>
        <p>Get push notifications from your webhooks.</p>
      </div>
      <h1 class="quota-title">Quota</h1>
      <p>You get <strong>100 quota per week</strong> for free (resets 7 days after your last reset).</p>

      <div id="redeem-section" class="hidden">
        <h2>Redeem a coupon</h2>
        <form id="redeem-form">
          <div class="quota-form-row">
            <input type="text" id="coupon-id" placeholder="Coupon code" required autocomplete="off" />
            <button type="submit" id="redeem-btn">Redeem</button>
          </div>
          <div id="redeem-msg" class="quota-msg" aria-live="polite"></div>
        </form>
      </div>

      <h2 class="quota-buy-heading">Buy a coupon</h2>
      <ul class="quota-buy-list" id="buy-list"></ul>
      <p class="quota-smallprint">Coupons don't expire.</p>
    </div>
    <script>
      (function() {
        fetch('/settings/me', { credentials: 'include' }).then(function(res) {
          var el = document.getElementById('redeem-section');
          if (res.ok && el) el.classList.remove('hidden');
        }).catch(function() {});

        var backEl = document.getElementById('back-block');
        var referrer = document.referrer;
        if (backEl && (!referrer || (function() {
          try { return new URL(referrer).origin !== window.location.origin; } catch (e) { return true; }
        })())) {
          backEl.classList.add('hidden');
        }

        var form = document.getElementById('redeem-form');
        var input = document.getElementById('coupon-id');
        var btn = document.getElementById('redeem-btn');
        var msg = document.getElementById('redeem-msg');

        form.addEventListener('submit', function(e) {
          e.preventDefault();
          msg.textContent = '';
          msg.className = 'quota-msg';
          btn.disabled = true;
          fetch('/settings/redeem-coupon', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ coupon_id: input.value.trim() })
          }).then(function(res) {
            if (res.status === 401) {
              window.location.href = '/';
              return;
            }
            return res.json().then(function(data) {
              if (res.ok) {
                msg.textContent = 'Redeemed! ' + (data.quota_basic + data.quota_extra) + ' quota now available.';
                msg.className = 'quota-msg success';
                input.value = '';
              } else {
                msg.textContent = data.message || 'Redeem failed.';
                msg.className = 'quota-msg error';
              }
            });
          }).catch(function() {
            msg.textContent = 'Something went wrong.';
            msg.className = 'quota-msg error';
          }).finally(function() {
            btn.disabled = false;
          });
        });

        var list = document.getElementById('buy-list');
        (typeof COUPON_PRICES !== 'undefined' ? COUPON_PRICES : []).forEach(function(o) {
          var li = document.createElement('li');
          li.innerHTML = '<span>' + (o.quota_extra || 0) + ' extra quota — £' + ((o.price_cents || 0) / 100).toFixed(2) + '</span><span class="coming">Coming soon</span>';
          list.appendChild(li);
        });
      })();
    </script>
  </body>
</html>
